[package]
name = "Blink"
version = "0.2.0"
edition = "2024"

authors = ["Noticxs <noticxs@ametrine.cc>", "Ametrine Foundation <business@ametrine.cc>"]
description = "The terminal search tool, search for your lost files directly from the terminal."
documentation = "https://docs.rs/blink"

homepage = "https://github.com/Ametrine-cc/blink"
repository = "https://github.com/Ametrine-cc/blink"

autogenerated = false
files = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

readme = "README.md"
license = "GPL-3.0"

keywords = ["cli", "ametrine", "search", "terminal", "linux"]
categories = ["cli", "file-search"]

[dependencies]

[[bin]]
name = "blink"
path = "src/main.rs"
